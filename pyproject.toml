[project]
name = "pdf-summarizer"
version = "0.1.0"
description = "Summarize URLs and PDFs into Obsidian-formatted Markdown using LLMs"
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "httpx",
    "pdfplumber",
    "trafilatura",
    "anthropic",
    "google-genai",
    "python-dotenv",
    "python-slugify",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_summarizer"]
